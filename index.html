<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Butterfly Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="container">
            <div class="todo-app">
                <h1>My Butterfly Checklist</h1>
                <h3>List 4 or more things you want to complete today!</h3>
                <h3>Click on the flowerbuds when you complete each task and watch them bloom!</h3>
                <div class="row">
                    <input type="text" id="input-box" placeholder="Add your item">
                    <button onclick="addTask()">Add Item</button>
                </div>
                <ul id="list-container">
                  
                </ul>            
            </div>

        </div>
        <script src="script.js"></script>
</body>
</html>
