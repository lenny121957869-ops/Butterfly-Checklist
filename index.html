<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Butterfly Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="container">
            <div class="todo-app">
                <h2>My Butterfly Checklist</h2>
                <h2>List 4 or more things you want to complete today!</h2>
                <div class="row">
                    <input type="text" id="input-box" placeholder="Add your item">
                    <button onclick="addTask()">Add Item</button>
                </div>
                <ul id="list-container">
                    <li class="checked">Task 1</li>
                    <li>Task 2</li>
                    <li>Task 3</li>
                    <li>Task 4</li>
                </ul>            
            </div>

        </div>
        <script src="script.js"></script>
</body>
</html>
